</head>

      </nav>
    </div>
  </div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html" aria-label="AISML ホーム">AISML</a>
      <nav class="desktop-nav" aria-label="メインナビゲーション">

        <a href="../contact/index.html">お問い合わせ</a>
      </nav>
      <details class="mobile-menu">
        <summary>メニュー <span aria-hidden="true">＋</span></summary>
        <nav aria-label="モバイル用メインナビゲーション">
          <a href="../about/index.html">AISMLについて</a>
          <a href="../reports/index.html">技術レポート</a>
          <a href="../documents/index.html">公開文書</a>
          <a href="../certification/index.html">マネジメントシステム認証</a>
          <a href="../certificate-search/index.html" aria-current="page">認証書の検索</a>
          <a href="../contact/index.html">お問い合わせ</a>
        </nav>
      </details>
    </div>
  </header>
  <main id="main">
    <section class="page-head wide" aria-labelledby="page-title">
      <div class="wrap">
        <h1 id="page-title">認証書の検索</h1>
        <p class="lead">コンテンツ準備中です。</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap prose wide">
        <div class="cert-search" data-cert-search data-count="{total} 件中 {shown} 件を表示">
          <div class="cert-controls" role="search">
            <label class="cert-field cert-query"><span>検索</span><input type="search" name="q" placeholder="認証番号、組織名、範囲、所在地" autocomplete="off"></label>
            <label class="cert-field"><span>規格</span><select name="standard"><option value="">すべて</option></select></label>
            <label class="cert-field"><span>状態</span><select name="status"><option value="">すべて</option><option value="valid">有効</option><option value="suspended">一時停止</option><option value="withdrawn">取消</option><option value="expired">期限切れ</option></select></label>
            <label class="cert-field"><span>認定機関</span><select name="ab"><option value="">すべて</option></select></label>
            <button type="button" class="button secondary" data-reset>条件をクリア</button>
          </div>
          <p class="cert-count" aria-live="polite" data-count-output></p>
          <div class="table-scroll" tabindex="0" role="region" aria-label="認証書一覧（横にスクロールできます）">
            <table class="data-table cert-table" role="table">
              <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">認証番号</th><th scope="col" role="columnheader">組織名</th><th scope="col" role="columnheader">規格</th><th scope="col" role="columnheader">認証範囲</th><th scope="col" role="columnheader">所在地</th><th scope="col" role="columnheader">発行日</th><th scope="col" role="columnheader">有効期限</th><th scope="col" role="columnheader">状態</th><th scope="col" role="columnheader">認証機関</th><th scope="col" role="columnheader">認定機関</th></tr></thead>
              <tbody role="rowgroup">

                <tr role="row" class="cert-empty" data-empty><td role="cell" colspan="10" data-empty-text="現在データはありません" data-nomatch-text="条件に一致する認証書はありません">現在データはありません</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p class="brand">AISML</p>
    </div>
  </footer>
</body>
</html>
