</head>

    <div class="wrap">

      </nav>
      <details class="mobile-menu">
        <summary>選單 <span aria-hidden="true">＋</span></summary>
        <nav aria-label="行動版主要導覽">
          <a href="../about/index.html">關於 AISML</a>
          <a href="../reports/index.html">技術報告</a>
          <a href="../documents/index.html">公開文件</a>
          <a href="../certification/index.html">管理系統驗證</a>

        </nav>
      </details>
    </div>
  </header>
  <main id="main">
    <section class="page-head wide" aria-labelledby="page-title">
      <div class="wrap">
        <h1 id="page-title">驗證文件查詢</h1>
        <p class="lead">內容整理中。</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap prose wide">
        <div class="cert-search" data-cert-search data-count="顯示 {shown} 筆，共 {total} 筆">
          <div class="cert-controls" role="search">
            <label class="cert-field cert-query"><span>搜尋</span><input type="search" name="q" placeholder="證書編號、組織名稱、範圍或場所" autocomplete="off"></label>
            <label class="cert-field"><span>驗證標準</span><select name="standard"><option value="">全部</option></select></label>
            <label class="cert-field"><span>狀態</span><select name="status"><option value="">全部</option><option value="valid">有效</option><option value="suspended">暫時中止</option><option value="withdrawn">終止</option><option value="expired">到期</option></select></label>
            <label class="cert-field"><span>認證機構</span><select name="ab"><option value="">全部</option></select></label>
            <button type="button" class="button secondary" data-reset>清除條件</button>
          </div>
          <p class="cert-count" aria-live="polite" data-count-output></p>
          <div class="table-scroll" tabindex="0" role="region" aria-label="證書清單，可左右捲動">
            <table class="data-table cert-table" role="table">
              <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">證書編號</th><th scope="col" role="columnheader">組織名稱</th><th scope="col" role="columnheader">驗證標準</th><th scope="col" role="columnheader">驗證範圍</th><th scope="col" role="columnheader">驗證場所</th><th scope="col" role="columnheader">發證日期</th><th scope="col" role="columnheader">有效期限</th><th scope="col" role="columnheader">狀態</th><th scope="col" role="columnheader">驗證機構</th><th scope="col" role="columnheader">認證機構</th></tr></thead>
              <tbody role="rowgroup">

                <tr role="row" class="cert-empty" data-empty><td role="cell" colspan="10" data-empty-text="目前無資料" data-nomatch-text="沒有符合條件的證書">目前無資料</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p class="brand">AISML</p>
    </div>
  </footer>
</body>
